name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew permission
        run: chmod +x ./gradlew

      - name: Verify project structure
        run: |
          test -f settings.gradle.kts || { echo "::error::settings missing"; exit 1; }
          test -f build.gradle.kts || { echo "::error::build missing"; exit 1; }
          test -d app || { echo "::error::app missing"; exit 1; }

      - name: Gradle version
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
        continue-on-error: true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mr-x-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
